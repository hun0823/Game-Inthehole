<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1834" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23d4814c'/%3E%3C/svg%3E" />
  <title>Rollin' Board</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="sky" class="sky" aria-hidden="true"></canvas>
  <div class="app">
    <header class="topbar">
      <div class="score-block">
        <svg class="crown" viewBox="0 0 96 70" aria-hidden="true">
          <defs>
            <linearGradient id="crownGold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff6cf"/>
              <stop offset="38%" stop-color="#ffd24a"/>
              <stop offset="72%" stop-color="#f0a818"/>
              <stop offset="100%" stop-color="#d48410"/>
            </linearGradient>
            <radialGradient id="ruby" cx="38%" cy="32%" r="70%">
              <stop offset="0%" stop-color="#ffd0dc"/>
              <stop offset="42%" stop-color="#e4254a"/>
              <stop offset="100%" stop-color="#8e1030"/>
            </radialGradient>
            <filter id="crownGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="2.4" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <ellipse cx="48" cy="40" rx="22" ry="12" fill="#ffc83d" opacity="0.7" filter="url(#crownGlow)"/>
          <path fill="url(#crownGold)" d="M14 48 L20 30 C22 24 26 26 28 32 L36 42 L42 20 C44 14 46 10 48 10 C50 10 52 14 54 20 L60 42 L68 32 C70 26 74 24 76 30 L82 48 Z"/>
          <rect x="12" y="46" width="72" height="13" rx="4" fill="url(#crownGold)"/>
          <rect x="18" y="49" width="60" height="2.4" rx="1.2" fill="rgba(255,255,255,0.55)"/>
          <circle cx="22" cy="30" r="3.6" fill="#fff8dc" stroke="#e0a020" stroke-width="1"/>
          <circle cx="48" cy="12" r="4.2" fill="#fff8dc" stroke="#e0a020" stroke-width="1"/>
          <circle cx="74" cy="30" r="3.6" fill="#fff8dc" stroke="#e0a020" stroke-width="1"/>
          <polygon points="48,26 53.5,33 48,39 42.5,33" fill="url(#ruby)" stroke="#ffe0e8" stroke-width="0.7"/>
        </svg>
        <div id="score-label" class="score">0</div>
      </div>
      <div class="level-block">
        <div class="level-row">
          <button type="button" id="btn-prev" class="chev" aria-label="Previous stage">‹</button>
          <button type="button" id="btn-select" class="level-btn">Lvl. 1</button>
          <button type="button" id="btn-next" class="chev" aria-label="Next stage">›</button>
        </div>
        <div id="moves-label" class="moves"></div>
      </div>
    </header>

    <main class="board-wrap">
      <div class="board-scene">
        <div id="board-tilt" class="board-tilt">
          <div id="board" class="board">
            <div id="board-well" class="board-well">
              <canvas id="playfield" class="playfield" aria-hidden="true"></canvas>
              <div id="hole" class="hole" aria-hidden="true"></div>
              <div id="ball-shadow" class="ball-shadow" aria-hidden="true"></div>
              <div id="ball" class="ball" aria-hidden="true">
                <div id="ball-spin" class="ball-spin">
                  <svg viewBox="0 0 100 100" aria-hidden="true">
                    <defs>
                      <radialGradient id="cuBody" cx="32%" cy="30%" r="72%">
                        <stop offset="0%" stop-color="#f7d7be"/>
                        <stop offset="20%" stop-color="#eeae78"/>
                        <stop offset="48%" stop-color="#d4814c"/>
                        <stop offset="76%" stop-color="#a95530"/>
                        <stop offset="100%" stop-color="#6c3018"/>
                      </radialGradient>
                      <clipPath id="ballClip"><circle cx="50" cy="50" r="47"/></clipPath>
                    </defs>
                    <circle cx="50" cy="50" r="47" fill="url(#cuBody)"/>
                    <g clip-path="url(#ballClip)" fill="none" stroke="#6a3018" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round">
                      <path d="M36 34 L50 26 L62 36 L58 52 L42 56 Z" fill="rgba(255,220,186,0.16)"/>
                      <path d="M36 34 Q24 26 18 38"/>
                      <path d="M50 26 Q58 14 72 20"/>
                      <path d="M62 36 Q80 40 82 54"/>
                      <path d="M58 52 Q66 70 48 80"/>
                      <path d="M42 56 Q26 70 18 58"/>
                      <path d="M18 38 Q12 50 18 58"/>
                      <path d="M72 20 Q88 32 82 54"/>
                      <path d="M48 80 Q34 90 22 78"/>
                    </g>
                    <circle cx="50" cy="50" r="46.2" fill="none" stroke="rgba(255,226,200,0.45)" stroke-width="1.4"/>
                  </svg>
                </div>
                <div class="ball-shade"></div>
                <div class="ball-glint"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="overlay-title">Cleared!</h2>
          <p id="overlay-msg"></p>
          <button id="overlay-btn" type="button">Next stage</button>
        </div>
      </div>
    </main>

    <nav class="controls" aria-label="Tilt the board">
      <div class="control-row">
        <button type="button" class="wood-control" data-dir="left">
          <span class="wood-face">
            <svg class="arrow" viewBox="0 0 64 64" aria-hidden="true">
              <polygon points="18,34 48,14 48,54" fill="#c5cedc"/>
              <polygon points="16,30 46,12 46,48" fill="#ffffff"/>
            </svg>
          </span>
          <span class="wood-label">Left</span>
        </button>
        <button type="button" class="wood-control" data-dir="up">
          <span class="wood-face wood-face--lg">
            <svg class="arrow arrow--lg" viewBox="0 0 64 64" aria-hidden="true">
              <polygon points="32,18 54,48 10,48" fill="#c5cedc"/>
              <polygon points="32,14 52,46 12,46" fill="#ffffff"/>
            </svg>
          </span>
          <span class="wood-label">Up</span>
        </button>
        <button type="button" class="wood-control" data-dir="right">
          <span class="wood-face">
            <svg class="arrow" viewBox="0 0 64 64" aria-hidden="true">
              <polygon points="46,34 16,14 16,54" fill="#c5cedc"/>
              <polygon points="48,30 18,12 18,48" fill="#ffffff"/>
            </svg>
            <span class="glint" aria-hidden="true"></span>
          </span>
          <span class="wood-label">Right</span>
        </button>
      </div>
      <div class="control-row control-row--sub">
        <button type="button" class="wood-control" data-dir="down">
          <span class="wood-face wood-face--sm">
            <svg class="arrow arrow--sm" viewBox="0 0 64 64" aria-hidden="true">
              <polygon points="32,50 10,18 54,18" fill="#c5cedc"/>
              <polygon points="32,46 12,16 52,16" fill="#ffffff"/>
            </svg>
          </span>
          <span class="wood-label">Down</span>
        </button>
        <button type="button" class="wood-control" id="btn-reset">
          <span class="wood-face wood-face--sm">
            <svg class="arrow arrow--sm" viewBox="0 0 64 64" aria-hidden="true">
              <path d="M44 22a16 16 0 1 0 2 14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
              <path d="M44 14v10h-10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="wood-label">Retry</span>
        </button>
      </div>
    </nav>
    <p class="sr-only">Swipe the board, or use arrow keys and WASD, to tilt. R resets the stage. N loads the next stage.</p>
  </div>

  <dialog id="stage-dialog">
    <h2>Stages</h2>
    <ul id="stage-list" class="stage-list"></ul>
    <button type="button" id="dialog-close">Close</button>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
