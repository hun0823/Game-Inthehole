<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Rollin' Board</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="pat-wood" width="48" height="48" patternUnits="userSpaceOnUse">
        <rect width="48" height="48" fill="#3d3548"/>
        <path d="M0 12h48M0 28h48" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        <path d="M8 0v48M24 0v48M40 0v48" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
      </pattern>
      <linearGradient id="grad-wall-top" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e8e0f4"/>
        <stop offset="45%" stop-color="#a898c4"/>
        <stop offset="100%" stop-color="#5c4d78"/>
      </linearGradient>
      <filter id="f-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
      </filter>
    </defs>
  </svg>
  <div class="app">
    <header class="header header--compact">
      <h1>Rollin' Board</h1>
    </header>

    <section class="hud">
      <div class="hud-item">
        <span class="label">스테이지</span>
        <span id="stage-label" class="value">1 / 5</span>
      </div>
      <div class="hud-item">
        <span class="label">크기</span>
        <span id="size-label" class="value">3×3</span>
      </div>
      <div class="hud-item">
        <span class="label">이동</span>
        <span id="moves-label" class="value">0</span>
      </div>
    </section>

    <main class="board-wrap">
      <div class="board-scene">
        <div class="scene-floor" aria-hidden="true"></div>
        <div id="board-tilt" class="board-tilt">
          <div id="board" class="board" aria-label="게임 보드">
            <div class="board-frame-3d" aria-hidden="true">
              <span class="frame-bar frame-n"></span>
              <span class="frame-bar frame-s"></span>
              <span class="frame-bar frame-e"></span>
              <span class="frame-bar frame-w"></span>
            </div>
            <div class="board-rim"></div>
            <div class="board-stage">
              <div class="board-inner">
                <canvas id="playfield" class="playfield" aria-hidden="true"></canvas>
                <div id="cells" class="cells cells-overlay"></div>
                <div id="walls" class="walls" aria-hidden="true"></div>
                <div id="ball-shadow" class="ball-shadow" aria-hidden="true"></div>
                <div id="ball" class="ball" aria-hidden="true">
                  <div class="ball-body">
                    <div class="ball-shine"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="board-drop-shadow" aria-hidden="true"></div>
        </div>
      </div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="overlay-title">클리어!</h2>
          <p id="overlay-msg"></p>
          <button id="overlay-btn" type="button">다음 스테이지</button>
        </div>
      </div>
    </main>

    <p class="hint">방향키 · WASD · 화면 버튼 · 스와이프로 기울이기</p>

    <nav class="controls" aria-label="기울이기 방향">
      <button type="button" class="tilt tilt-up" data-dir="up" aria-label="위로 기울이기">▲</button>
      <div class="controls-mid">
        <button type="button" class="tilt tilt-left" data-dir="left" aria-label="왼쪽으로 기울이기">◀</button>
        <button type="button" class="tilt tilt-reset" id="btn-reset" aria-label="다시 시작">↺</button>
        <button type="button" class="tilt tilt-right" data-dir="right" aria-label="오른쪽으로 기울이기">▶</button>
      </div>
      <button type="button" class="tilt tilt-down" data-dir="down" aria-label="아래로 기울이기">▼</button>
    </nav>

    <footer class="footer">
      <button type="button" id="btn-prev" class="text-btn">◀ 이전</button>
      <button type="button" id="btn-select" class="text-btn">스테이지 선택</button>
      <button type="button" id="btn-next" class="text-btn">다음 ▶</button>
    </footer>
  </div>

  <dialog id="stage-dialog">
    <h2>스테이지 선택</h2>
    <ul id="stage-list" class="stage-list"></ul>
    <button type="button" id="dialog-close">닫기</button>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
